name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wizard
          POSTGRES_PASSWORD: wizard_test
          POSTGRES_DB: wizard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wizard -d wizard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wizard:wizard_test@localhost:5432/wizard_test
      DIRECT_URL: postgresql://wizard:wizard_test@localhost:5432/wizard_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify workflow rules
        run: node --experimental-strip-types --test tests/workflow.test.mjs tests/campaign-rules.test.mjs tests/artwork-lifecycle.test.mjs

      - name: Build Wizard OS
        run: npm run build

      - name: Install browser for persistence verification
        run: npx playwright install --with-deps chromium

      - name: Verify campaign API and browser persistence
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/wizard-server.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/api/campaigns > /dev/null && break
            sleep 1
          done
          node tests/campaign-integration.mjs
          node tests/artwork-integration.mjs
          node tests/campaign-browser.mjs
